name: Build LibrePods Plus APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Get original LibrePods
        run: |
          git clone https://github.com/librepods-org/librepods.git /tmp/librepods
          rm -rf android
          cp -r /tmp/librepods/android ./android
          echo "Copied android folder"
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LibrePods-Plus-APK
          path: android/app/build/outputs/apk/debug/*.apk
